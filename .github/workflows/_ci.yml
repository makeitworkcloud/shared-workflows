name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run pre-commit
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=never 2>&1 | tee validation.log

      - name: Report validation on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_FAILED: ${{ steps.validation.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shared-workflows-ci-status -->';
            const failed = process.env.VALIDATION_FAILED === 'true';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const maxLength = 12000;
            const output = fs.existsSync('validation.log')
              ? fs.readFileSync('validation.log', 'utf8')
                .replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '')
                .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, '***REDACTED***')
                .replace(/````/g, '\\`\\`\\`\\`')
              : 'No validation output was captured.';
            const excerpt = output.length > maxLength ? output.slice(-maxLength) : output;
            const status = failed ? 'failed' : 'passed';
            const body = `${marker}\n## Shared workflows CI ${status}\n\n[View the workflow run](${workflowUrl}).\n\n#### Validation output (redacted, last ${maxLength} characters)\n\n\`\`\`\`text\n${excerpt}\n\`\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Mark validation failed
        if: always() && steps.validation.outcome == 'failure'
        run: exit 1
