name: opencode-review

on:
  workflow_call:
    inputs:
      enabled:
        type: boolean
        default: false
      model:
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: opencode-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      inputs.enabled && vars.OPENCODE_REVIEW_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: anomalyco/opencode/github@148842ef7cb1bc34192b3fff57d0f9721ab9c801 # v1.19.4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG_CONTENT: '{"$schema":"https://opencode.ai/config.json","default_agent":"plan"}'
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          prompt: |
            Review this pull request for correctness, security, and regressions.
            This is advisory only. Do not modify files, commit, push, create pull
            requests, or execute repository scripts. Report findings with file
            references. Clearly state missing context, failures, and validation
            that was not performed; do not claim a completed review when blocked.
