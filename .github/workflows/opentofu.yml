name: opentofu

on:
  workflow_call:
    inputs:
      environment:
        description: Environment for apply job
        type: string
        default: production
      runs-on:
        description: Runner label
        type: string
        default: arc-tf
      setup-ssh:
        description: Whether to setup SSH keys
        type: boolean
        default: false
      aws-region:
        description: AWS region for SOPS KMS access
        type: string
        default: us-west-2
      aws-role-to-assume:
        description: AWS IAM role to assume for SOPS KMS access
        type: string
        default: arn:aws:iam::332355796717:role/github-actions-sops-kms
      gcp-workload-identity-provider:
        description: Google Workload Identity Provider resource name
        type: string
        default: ""
      gcp-service-account:
        description: Google service account email to impersonate through Workload Identity Federation
        type: string
        default: ""
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      SSH_KNOWN_HOSTS:
        required: false
      NAMECHEAP_API_KEY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch canonical pre-commit config
        id: fetch-config
        continue-on-error: true
        run: |
          curl -sSL -o .pre-commit-config.yaml \
            https://raw.githubusercontent.com/makeitworkcloud/images/main/tfroot-runner/pre-commit-config.yaml
      - name: Initialize OpenTofu
        id: initialize
        continue-on-error: true
        run: tofu init -backend=false
      - name: Generate Terraform docs
        id: terraform-docs
        continue-on-error: true
        run: |
          set -euo pipefail
          set +e
          pre-commit run terraform_docs -a
          terraform_docs_exit_code=$?
          set -e
          changed_files="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          if [ -z "$changed_files" ]; then
            if [ "$terraform_docs_exit_code" -ne 0 ]; then
              exit "$terraform_docs_exit_code"
            fi
            exit 0
          fi
          unexpected_files="$(printf '%s\n' "$changed_files" | grep -vx 'README.md' || true)"
          if [ -n "$unexpected_files" ]; then
            printf 'terraform_docs changed files other than README.md:\n%s\n' "$unexpected_files" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" != 'pull_request' ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo 'Terraform documentation is out of date. Update README.md in the pull request branch.' >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit generated Terraform docs
        if: >-
          steps.terraform-docs.outcome == 'success' &&
          steps.terraform-docs.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(docs): update Terraform documentation'
          git push origin "HEAD:$PR_HEAD_REF"
      - name: Run tests
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          SKIP=no-commit-to-branch pre-commit run -a --color=never 2>&1 | tee validation-output.txt
      - name: Report validation on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_FAILED: >-
            ${{ steps.checkout.outcome == 'failure' ||
                steps.fetch-config.outcome == 'failure' ||
                steps.initialize.outcome == 'failure' ||
                steps.terraform-docs.outcome == 'failure' ||
                steps.validation.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opentofu-ci-status -->';
            const failed = process.env.VALIDATION_FAILED === 'true';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const maxLength = 12000;
            const output = fs.existsSync('validation-output.txt')
              ? fs.readFileSync('validation-output.txt', 'utf8')
                .replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '')
                .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, '***REDACTED***')
                .replace(/````/g, '\\`\\`\\`\\`')
              : 'No validation output was captured.';
            const excerpt = output.length > maxLength ? output.slice(-maxLength) : output;
            const status = failed ? 'failed' : 'passed';
            const body = `${marker}\n## OpenTofu CI ${status}\n\n[View the workflow run](${workflowUrl}).\n\n#### Validation output (redacted, last ${maxLength} characters)\n\n\`\`\`\`text\n${excerpt}\n\`\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Mark validation failed
        if: >-
          always() &&
          (steps.checkout.outcome == 'failure' ||
           steps.fetch-config.outcome == 'failure' ||
           steps.initialize.outcome == 'failure' ||
           steps.terraform-docs.outcome == 'failure' ||
           steps.validation.outcome == 'failure')
        run: exit 1

  plan:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ${{ inputs.runs-on }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Configure AWS credentials for SOPS KMS
        if: inputs.gcp-workload-identity-provider == ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
      - name: Configure Google credentials through Workload Identity Federation
        if: inputs.gcp-workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}
      - name: Install SSH key
        if: ${{ inputs.setup-ssh }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: OpenTofu Plan
        id: plan
        env:
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
        run: |
          set -o pipefail
          export SHELLOPTS
          set +e
          make plan 2>&1 | tee plan-output.txt
          plan_exit_code=$?
          set -e

          if [ -s plan-output.txt ]; then
            sed -n "/OpenTofu will perform the following actions:/,\$p" plan-output.txt > plan-filtered.txt
            if [ ! -s plan-filtered.txt ]; then
              if ! grep -A 2 "No changes" plan-output.txt > plan-filtered.txt; then
                cp plan-output.txt plan-filtered.txt
              fi
            fi
          else
            if [ "$plan_exit_code" -eq 0 ]; then
              plan_exit_code=1
            fi
            echo "No plan output found" > plan-filtered.txt
          fi

          sed -E $'s/\x1B\\[[0-?]*[ -\\/]*[@-~]//g' plan-filtered.txt |
            sed -E \
              -e '/(secret|token|password|private[_ -]?key|credential|authorization|access[_ -]?key|client[_ -]?secret|kubeconfig|sops)/I c\[REDACTED: potentially sensitive plan output]' \
              > plan-filtered-redacted.txt
          mv plan-filtered-redacted.txt plan-filtered.txt
          printf 'exit-code=%s\n' "$plan_exit_code" >> "$GITHUB_OUTPUT"
          tail -n 1000 plan-filtered.txt > plan-filtered-truncated.txt
          mv plan-filtered-truncated.txt plan-filtered.txt
      - name: prepare-comment
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
        run: |
          {
            echo '<!-- opentofu-plan -->'
            echo '#### OpenTofu Plan'
            if [ "$PLAN_EXIT_CODE" -ne 0 ]; then
              echo "OpenTofu plan failed with exit code $PLAN_EXIT_CODE."
            fi
            echo '````diff'
            cat plan-filtered.txt
            echo '````'
          } > comment-body.md
      - name: comment
        uses: johanwulf/replace-comment@73e5abab2457a7742d94f71355f878f25e950c71 # v1.0.1
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- opentofu-plan -->'
          body-path: comment-body.md
      - name: Fail if plan failed
        if: steps.plan.outputs.exit-code != '0'
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
        run: exit "$PLAN_EXIT_CODE"

  apply:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials for SOPS KMS
        if: inputs.gcp-workload-identity-provider == ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
      - name: Configure Google credentials through Workload Identity Federation
        if: inputs.gcp-workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}
      - name: Install SSH key
        if: ${{ inputs.setup-ssh }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: OpenTofu Apply
        env:
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
        run: make apply
