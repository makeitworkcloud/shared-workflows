name: opentofu

on:
  workflow_call:
    inputs:
      environment:
        description: Environment for apply job
        type: string
        default: production
      runs-on:
        description: Runner label
        type: string
        default: arc-tf
      setup-ssh:
        description: Whether to setup SSH keys
        type: boolean
        default: false
      aws-region:
        description: AWS region for SOPS KMS access
        type: string
        default: us-west-2
      aws-role-to-assume:
        description: AWS IAM role to assume for SOPS KMS access
        type: string
        default: arn:aws:iam::332355796717:role/github-actions-sops-kms
      gcp-workload-identity-provider:
        description: Google Workload Identity Provider resource name
        type: string
        default: ""
      gcp-service-account:
        description: Google service account email to impersonate through Workload Identity Federation
        type: string
        default: ""
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      SSH_KNOWN_HOSTS:
        required: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch canonical pre-commit config
        run: |
          curl -sSL -o .pre-commit-config.yaml \
            https://raw.githubusercontent.com/makeitworkcloud/images/main/tfroot-runner/pre-commit-config.yaml

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Run tests
        run: SKIP=no-commit-to-branch pre-commit run -a

  plan:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ${{ inputs.runs-on }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials for SOPS KMS
        if: inputs.gcp-workload-identity-provider == ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Configure Google credentials through Workload Identity Federation
        if: inputs.gcp-workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      - name: Install SSH key
        if: ${{ inputs.setup-ssh }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: OpenTofu Plan
        id: plan
        run: |
          set -o pipefail
          export SHELLOPTS
          set +e
          make plan
          plan_exit_code=$?
          set -e

          if [ -s plan-output.txt ]; then
            sed -n '/OpenTofu will perform the following actions:/,$p' plan-output.txt > plan-filtered.txt

            if [ ! -s plan-filtered.txt ]; then
              if ! grep -A 2 "No changes" plan-output.txt > plan-filtered.txt; then
                cp plan-output.txt plan-filtered.txt
              fi
            fi
          else
            if [ "$plan_exit_code" -eq 0 ]; then
              plan_exit_code=1
            fi
            echo "No plan output found" > plan-filtered.txt
          fi

          printf 'exit-code=%s\n' "$plan_exit_code" >> "$GITHUB_OUTPUT"

          tail -n 1000 plan-filtered.txt > plan-filtered-truncated.txt
          mv plan-filtered-truncated.txt plan-filtered.txt

      - name: prepare-comment
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
        run: |
          {
            echo '<!-- opentofu-plan -->'
            echo '#### OpenTofu Plan'
            if [ "$PLAN_EXIT_CODE" -ne 0 ]; then
              echo "OpenTofu plan failed with exit code $PLAN_EXIT_CODE."
            fi
            echo '```'
            cat plan-filtered.txt
            echo '```'
          } > comment-body.md

      - name: comment
        uses: johanwulf/replace-comment@73e5abab2457a7742d94f71355f878f25e950c71 # v1.0.1
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- opentofu-plan -->'
          body-path: comment-body.md

      - name: Fail if plan failed
        if: steps.plan.outputs.exit-code != '0'
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit-code }}
        run: exit "$PLAN_EXIT_CODE"

  apply:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runs-on }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials for SOPS KMS
        if: inputs.gcp-workload-identity-provider == ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Configure Google credentials through Workload Identity Federation
        if: inputs.gcp-workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      - name: Install SSH key
        if: ${{ inputs.setup-ssh }}
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: OpenTofu Apply
        run: make apply
