---
name: stale-pull-requests

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      # actions/stale only evaluates its close window after it marks a PR stale.
      # A zero-day window therefore closes on the following daily run, never
      # before the configured 30-day inactivity threshold.
      - name: Close inactive pull requests
        id: stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 0
          stale-pr-label: stale
          stale-pr-message: ""
          close-pr-message: >-
            This pull request was closed after 30 days without activity. Its
            same-repository head branch is deleted only when it is eligible for
            GitHub's closed-pull-request branch recovery.
          exempt-pr-labels: do-not-close,blocked,security
          exempt-all-pr-milestones: true
          exempt-all-pr-assignees: true
          exempt-draft-pr: true
          delete-branch: false
          operations-per-run: 30

      - name: Delete recoverable same-repository head branches
        if: steps.stale.outputs['closed-issues-prs'] != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOSED_PULL_REQUESTS: ${{ steps.stale.outputs['closed-issues-prs'] }}
        with:
          script: |
            const closed = JSON.parse(process.env.CLOSED_PULL_REQUESTS || '[]');
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const { number } of closed) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              const branch = pullRequest.head.ref;

              if (pullRequest.head.repo?.full_name !== repository.full_name) {
                core.info(`Skipping #${number}: the head branch is not in this repository.`);
                continue;
              }
              if (branch === repository.default_branch) {
                core.info(`Skipping #${number}: the head branch is the default branch.`);
                continue;
              }

              const { data: branchDetails } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch,
              });
              if (branchDetails.protected) {
                core.info(`Skipping #${number}: ${branch} is protected.`);
                continue;
              }

              const { data: openPullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`,
              });
              if (openPullRequests.length > 0) {
                core.info(`Skipping #${number}: ${branch} is referenced by another open pull request.`);
                continue;
              }

              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted same-repository head branch ${branch} for closed PR #${number}.`);
            }
